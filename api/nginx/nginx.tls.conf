upstream api_backend {
    server api:3000;
}

# HTTP → HTTPS
server {
    listen 80;
    server_name srv-project.mspu.edu.ru;
    return 301 https://srv-project.mspu.edu.ru$request_uri;
}

server {
    listen 443 ssl;
    http2 on;

    server_name srv-project.mspu.edu.ru;
    server_tokens off;

    ssl_certificate /etc/nginx/certs/fullchain.pem;
    ssl_certificate_key /etc/nginx/certs/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 1d;
    ssl_session_tickets off;

    # Для тестового внутреннего домена — короткий max-age.
    # После стабилизации домена и CA увеличьте до 31536000.
    add_header Strict-Transport-Security "max-age=300" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "no-referrer" always;
    add_header Permissions-Policy "geolocation=(), microphone=(), camera=()" always;

    client_max_body_size 100k;

    # Не отдаём мобильному клиенту HTML-страницу ошибки nginx.
    error_page 502 503 504 = @upstream_error;
    location @upstream_error {
        internal;
        default_type application/json;
        return 502 '{"success":false,"message":"API unavailable"}';
    }

    location /api/ {
        proxy_pass http://api_backend;
        proxy_http_version 1.1;

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        proxy_connect_timeout 10s;
        proxy_read_timeout 60s;
        proxy_send_timeout 60s;
    }

    location = /health {
        proxy_pass http://api_backend;
        proxy_set_header Host $host;
    }

    location = /ready {
        proxy_pass http://api_backend;
        proxy_set_header Host $host;
    }

    location / {
        return 404;
    }
}
